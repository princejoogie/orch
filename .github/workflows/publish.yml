name: Publish release assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - run: bun run package:smoke

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

  standalone:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - run: bun run build:standalone -- ${{ matrix.target }}

      - name: Upload standalone release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "dist/release/orch-${{ matrix.target }}.tar.gz" "dist/release/orch-${{ matrix.target }}.tar.gz.sha256" --clobber

  update-homebrew:
    runs-on: ubuntu-latest
    needs: standalone
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    steps:
      - name: Download standalone checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "*.sha256" --dir dist/release

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          : "${GH_TOKEN:?Set HOMEBREW_TAP_TOKEN to a token with access to the Homebrew tap}"
          : "${HOMEBREW_TAP_REPOSITORY:?Set HOMEBREW_TAP_REPOSITORY, for example owner/homebrew-tap}"
          version="${GITHUB_REF_NAME#v}"
          cat dist/release/*.sha256 > dist/release/checksums.txt
          checksum() {
            awk -v file="$1" '$2 == file { print $1 }' dist/release/checksums.txt
          }
          gh api --method POST "repos/${HOMEBREW_TAP_REPOSITORY}/dispatches" \
            -f event_type=orch-release \
            -f client_payload[tag]="${GITHUB_REF_NAME}" \
            -f client_payload[version]="${version}" \
            -f client_payload[darwin_arm64_sha256]="$(checksum orch-darwin-arm64.tar.gz)" \
            -f client_payload[darwin_x64_sha256]="$(checksum orch-darwin-x64.tar.gz)" \
            -f client_payload[linux_arm64_sha256]="$(checksum orch-linux-arm64.tar.gz)" \
            -f client_payload[linux_x64_sha256]="$(checksum orch-linux-x64.tar.gz)"
